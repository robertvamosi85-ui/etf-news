<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF News</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b08;
  --frame:#0f120d;
  --surface:#161a11;
  --surface-2:#1e2317;
  --rule:rgba(232,228,217,0.10);
  --rule-strong:rgba(232,228,217,0.20);
  --ink:#e9e5d8;
  --ink-dim:#9b9686;
  --copper:#c1652b;
  --copper-light:#d98a4f;
  --up:#5fd576;
  --down:#e3625b;
  --researched:#d4941e;
  --screener:#6f7666;
  --mono:'JetBrains Mono',monospace;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Libre Franklin',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;}

.frame{max-width:440px;margin:0 auto;background:var(--frame);min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom,0));}

.masthead{text-align:center;padding:28px 24px 18px;border-bottom:1px solid var(--rule-strong);}
.mast-mark{width:34px;height:34px;margin:0 auto 10px;display:block;}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.01em;color:var(--ink);}
.mast-sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper-light);margin-top:6px;}

.meta-bar{display:flex;justify-content:center;gap:8px;padding:10px 20px;font-family:var(--mono);font-size:10px;color:var(--ink-dim);border-bottom:1px solid var(--rule);flex-wrap:wrap;align-items:center;}
.meta-bar .dot{color:var(--rule-strong);}
/* --- FX chip (Stocks): ambient EUR/USD reference, hides if movers.js absent --- */
.fx-chip{font-family:var(--mono);font-size:10px;color:var(--copper-light);border:1px solid var(--copper);border-radius:2px;padding:1px 7px;letter-spacing:.03em;}

.main-tabs{display:flex;margin:18px 20px 0;border:1px solid var(--rule-strong);}
.mtab{flex:1;background:none;border:none;color:var(--ink-dim);font-family:var(--serif);font-style:italic;font-weight:600;font-size:14px;padding:12px 0;cursor:pointer;border-right:1px solid var(--rule-strong);}
.mtab:last-child{border-right:none;}
.mtab.on{background:var(--copper);color:#0a0b08;}
.main-view{display:none;}
.main-view.on{display:block;}

/* --- universe label (Stocks): buyability + currency + source status --- */
.universe-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-dim);text-align:center;margin:12px 20px 0;padding:7px 8px;border:1px dashed var(--rule-strong);border-radius:2px;}
.universe-label b{color:var(--copper-light);font-weight:600;}
.src-tag{text-transform:uppercase;font-weight:700;}
.src-verified{color:var(--up);}
.src-divergent{color:var(--researched);}
.empty-note{text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-dim);padding:40px 20px;letter-spacing:.04em;}

.period-tabs{display:flex;margin:18px 20px 4px;border:1px solid var(--rule-strong);}
.ptab{flex:1;background:none;border:none;color:var(--ink-dim);font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:9px 0;cursor:pointer;border-right:1px solid var(--rule-strong);}
.ptab:last-child{border-right:none;}
.ptab.on{background:var(--copper);color:#0a0b08;font-weight:700;}
.period-panel{display:none;}
.period-panel.on{display:block;}

.sec-label{display:flex;align-items:center;gap:10px;margin:20px 20px 8px;}
.sec-label h2{font-family:var(--serif);font-size:15px;font-weight:600;font-style:italic;white-space:nowrap;color:var(--ink);}
.sec-label.worst h2{color:var(--down);}
.sec-label.best h2{color:var(--up);}
.sec-label::after{content:'';flex:1;height:1px;background:var(--rule);}

.rank-list{margin:0 20px;border-top:1px solid var(--rule);}
.rank-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--rule);cursor:pointer;}
.rank-row:active{background:var(--surface);}
.rank-num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);padding-top:2px;}
.rank-ticker{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);}
.rank-name{font-family:var(--sans);font-size:10.5px;color:var(--ink-dim);font-weight:400;display:block;margin-top:2px;}
.rank-tags{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap;}
.tag-cat{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--ink-dim);border:1px solid var(--rule-strong);padding:1px 6px;border-radius:2px;}
/* --- currency tag (Stocks): self-labels each row's reporting currency --- */
.tag-ccy{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--copper-light);border:1px solid var(--copper);padding:1px 6px;border-radius:2px;font-weight:600;}
.badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;padding:1px 6px;border-radius:2px;font-weight:600;}
.badge-thin{color:var(--copper-light);border:1px solid var(--copper);}
.badge-trend{color:#0a0b08;background:var(--researched);}
/* --- volume-confirmation badge (Stocks, 1M only) --- */
.badge-vol{color:#0a0b08;background:var(--researched);}
.rank-pct{font-family:var(--mono);font-size:15px;font-weight:700;text-align:right;padding-top:2px;}
.pct-up{color:var(--up);}
.pct-down{color:var(--down);}

.drill-panel{display:none;margin:0 4px 10px;padding:14px 14px 12px;background:var(--surface-2);border-left:2px solid var(--rule-strong);}
.drill-panel.open{display:block;}
.tier-tag{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:2px 7px;border-radius:2px;margin-bottom:10px;font-weight:700;}
.tier-researched{background:var(--researched);color:#0a0b08;}
.tier-screener{background:none;border:1px solid var(--screener);color:var(--screener);}
.tier-portfolio{background:none;border:1px solid var(--copper-light);color:var(--copper-light);}
.drill-row{font-size:12px;color:var(--ink);line-height:1.6;margin-bottom:7px;}
.drill-row:last-child{margin-bottom:0;}
.drill-row b{color:var(--ink-dim);font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;display:inline-flex;align-items:center;gap:5px;margin-bottom:2px;}
/* --- driver tag chips (Stocks, researched tier) --- */
.drivers{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px;}
.drv{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;padding:1px 6px;border-radius:2px;border:1px solid var(--screener);color:var(--screener);}
.drv.fund{border-color:var(--up);color:var(--up);}
.drv.sent{border-color:var(--copper-light);color:var(--copper-light);}

.info-btn{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--ink-dim);color:var(--ink-dim);font-family:var(--serif);font-size:9px;font-style:italic;font-weight:600;cursor:pointer;flex-shrink:0;}
.info-btn.on{border-color:var(--copper-light);color:var(--copper-light);}
.info-pop{display:none;margin:2px 0 8px;padding:8px 10px;background:var(--surface);border-left:2px solid var(--copper);font-family:var(--sans);font-size:11px;color:var(--ink-dim);line-height:1.55;}
.info-pop.open{display:block;}
@media (hover:hover) and (pointer:fine){
  .drill-row:has(.info-btn:hover) + .info-pop{display:block;}
}

.holdings-list{margin:0 20px;border-top:1px solid var(--rule);}
.holdings-head{display:grid;grid-template-columns:1fr 44px 44px 44px;gap:6px;padding:0 4px 7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);border-bottom:1px solid var(--rule-strong);}
.holdings-head span:not(:first-child){text-align:right;}
.holdings-row{display:grid;grid-template-columns:1fr 44px 44px 44px;gap:6px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule);cursor:pointer;}
.holdings-row:active{background:var(--surface);}
.holdings-ticker{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);}
.holdings-name{font-family:var(--sans);font-size:10px;color:var(--ink-dim);display:block;margin-top:2px;}
.holdings-pct{font-family:var(--mono);font-size:11.5px;font-weight:700;text-align:right;}

/* ============ MAG7 SCORECARD ============ */
.mag7-universe{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-dim);text-align:center;margin:12px 20px 0;padding:7px 8px;border:1px dashed var(--rule-strong);border-radius:2px;}
.mag7-universe b{color:var(--copper-light);font-weight:600;}
.mag7-cards{margin:14px 20px 0;}
.mag7-card{background:var(--surface);border-left:3px solid var(--rule-strong);margin-bottom:12px;padding:14px 14px 12px;}
.mag7-card.v-buy{border-left-color:var(--up);}
.mag7-card.v-hold{border-left-color:var(--copper-light);}
.mag7-card.v-watch{border-left-color:var(--researched);}
.mag7-card.v-caution{border-left-color:var(--down);}
.mag7-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.mag7-ticker{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink);}
.mag7-name{font-family:var(--sans);font-size:10.5px;color:var(--ink-dim);display:block;margin-top:1px;}
.mag7-price{text-align:right;}
.mag7-price-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);}
.mag7-change{font-family:var(--mono);font-size:11px;font-weight:700;display:block;margin-top:1px;}
.mag7-theme{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--copper-light);margin-bottom:8px;}
.mag7-pe{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-bottom:6px;}
.mag7-pe em{font-family:var(--sans);font-style:normal;font-size:11px;color:var(--ink-dim);opacity:.7;}
.mag7-news{font-family:var(--sans);font-size:11.5px;color:var(--ink);line-height:1.55;margin-bottom:8px;}
.mag7-meta-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
.mag7-earnings{font-family:var(--mono);font-size:10px;color:var(--ink-dim);}
.mag7-prox{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;padding:1px 6px;border-radius:2px;font-weight:700;}
.mag7-prox.p-imminent{background:var(--down);color:#0a0b08;}
.mag7-prox.p-soon{background:var(--researched);color:#0a0b08;}
.mag7-prox.p-upcoming{background:none;border:1px solid var(--copper);color:var(--copper-light);}
.mag7-prox.p-far{background:none;border:1px solid var(--rule-strong);color:var(--ink-dim);}
.mag7-target{font-family:var(--mono);font-size:10px;color:var(--ink-dim);}
.mag7-verdict-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--rule);}
.mag7-verdict-badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;font-weight:700;padding:2px 8px;border-radius:2px;}
.mag7-verdict-badge.vb-buy{background:var(--up);color:#0a0b08;}
.mag7-verdict-badge.vb-hold{background:var(--copper-light);color:#0a0b08;}
.mag7-verdict-badge.vb-watch{background:var(--researched);color:#0a0b08;}
.mag7-verdict-badge.vb-caution{background:var(--down);color:#0a0b08;}
.mag7-reason{font-family:var(--sans);font-size:11px;color:var(--ink-dim);line-height:1.45;flex:1;}

.ledger-close{margin:26px 20px 0;padding-top:16px;border-top:2px double var(--rule-strong);text-align:center;}
.close-stat{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--copper-light);}
.close-stat span{font-family:var(--sans);font-size:12px;color:var(--ink-dim);font-weight:400;}
.close-note{font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.04em;margin-top:6px;}
</style>
</head>
<body>
<div class="frame">

  <div class="masthead">
    <svg class="mast-mark" viewBox="0 0 34 34" fill="none">
      <path d="M3 24 L11 14 L17 19 L31 6" stroke="#c1652b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 24 L3 30 L31 30" stroke="#9b9686" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <h1>ETF News</h1>
    <div class="mast-sub">ETF Performance · Lightyear EUR Universe</div>
  </div>

  <div class="meta-bar" id="meta-bar"></div>

  <div class="main-tabs">
    <button class="mtab on" onclick="showMain('performers',this)">Performers</button>
    <button class="mtab" onclick="showMain('portfolio',this)">Portfolio</button>
    <button class="mtab" onclick="showMain('stocks',this)">Stocks</button>
    <button class="mtab" onclick="showMain('mag7',this)">Mag7</button>
  </div>

  <div class="main-view on" id="view-performers">
    <div class="period-tabs">
      <button class="ptab on" onclick="showTab('1m',this)">1M</button>
      <button class="ptab" onclick="showTab('6m',this)">6M</button>
      <button class="ptab" onclick="showTab('ytd',this)">YTD</button>
    </div>
    <div class="period-panel on" id="panel-1m"></div>
    <div class="period-panel" id="panel-6m"></div>
    <div class="period-panel" id="panel-ytd"></div>
  </div>

  <div class="main-view" id="view-portfolio">
    <div class="sec-label"><h2>My Portfolio</h2></div>
    <div class="holdings-list" id="holdings-list"></div>
  </div>

  <!-- STOCKS: S&P 500 movers, own currency (USD), populated by movers.js -->
  <div class="main-view" id="view-stocks">
    <div class="universe-label" id="stocks-universe"></div>
    <div class="period-tabs">
      <button class="ptab on" onclick="showStockTab('1m',this)">1M</button>
      <button class="ptab" onclick="showStockTab('6m',this)">6M</button>
      <button class="ptab" onclick="showStockTab('ytd',this)">YTD</button>
    </div>
    <div class="period-panel on" id="spanel-1m"></div>
    <div class="period-panel" id="spanel-6m"></div>
    <div class="period-panel" id="spanel-ytd"></div>
  </div>

  <!-- MAG7: Magnificent Seven scorecard, populated by mag7.js -->
  <div class="main-view" id="view-mag7"></div>

  <div class="ledger-close" id="ledger-close"></div>

</div>

<script src="etf_data.js?v=2026-07-11"></script>
<script src="movers.js?v=2026-08-09"></script>
<script src="mag7.js?v=2026-08-02"></script>
<script>
// ---- plain-English explainer text for the jargon info buttons ----
const INFO_TEXT = {
  category: 'Every fund is compared only to similar funds, not the whole market. A semiconductor fund is judged against other tech funds, not against gold miners. That\'s what "category" means here.',
  returnRisk: 'How much gain you got for how bumpy the ride was. A fund that climbs steadily scores higher than one that swings wildly to reach the same gain. Above 1 means a smooth win; below 1 means it was a rough ride to get there.',
  week52: 'Where the price sits between its lowest and highest point over the past year. 100% means it\'s at a 12-month high right now. 0% means it\'s at a 12-month low.',
  aumFlow: 'AUM is simply the total money invested in the fund. If that\'s growing at the same time as the price, real investors are putting new money in — it\'s not just the existing price drifting up on its own.',
  topHoldings: 'How much of the fund sits in just its 3 biggest positions. A high number means one company\'s bad day can drag the whole fund down with it.',
  // --- Stocks-tab explainers ---
  vsSector: 'Each stock is compared only to other companies in its own S&P 500 sector, not the whole market. A chipmaker is judged against other tech names, not against banks or oil producers.',
  drivers: 'A quick tag for WHY it moved. "Fundamental" = real earnings or demand moved it. "Sentiment" = momentum or hype without matching numbers. "Mechanical" = index or passive-flow effects. "Optionality" = a bet on a future event not yet in the results.',
  volume: 'How busy trading was versus this stock\'s own normal. "2× normal" means twice as many shares changed hands as usual — a big move on heavy volume reflects real conviction, not just a handful of thin trades.'
};

let idCounter = 0;
function nextId(prefix){ idCounter += 1; return prefix + '-' + idCounter; }

function fmtPct(n){
  const sign = n >= 0 ? '+' : '';
  return sign + n.toFixed(1) + '%';
}
function pctClass(n){ return n >= 0 ? 'pct-up' : 'pct-down'; }

function infoBtnHtml(id){
  return '<span class="info-btn" onclick="toggleInfo(\'' + id + '\')">i</span>';
}
function infoPopHtml(id, text){
  return '<div class="info-pop" id="' + id + '">' + text + '</div>';
}
function badgesHtml(fund){
  if(!fund.badges || !fund.badges.length) return '';
  return fund.badges.map(function(b){
    if(b === 'Thin liquidity') return '<span class="badge badge-thin">Thin liquidity</span>';
    if(b === 'reversal watch') return '<span class="badge badge-trend">&#8634; reversal watch</span>';
    if(b === 'high vol') return '<span class="badge badge-vol">high vol</span>';
    return '<span class="badge badge-thin">' + b + '</span>';
  }).join('');
}

function fieldRow(label, value, infoKey, idPrefix){
  if(!value) return '';
  let out = '<div class="drill-row"><b>' + label;
  let pop = '';
  if(infoKey){
    const id = nextId(idPrefix + '-i');
    out += infoBtnHtml(id);
    pop = infoPopHtml(id, INFO_TEXT[infoKey]);
  }
  out += '</b>' + value + '</div>' + pop;
  return out;
}

// ---- Driver chips row (Stocks, researched tier). Omitted if no drivers. ----
function driversRow(drivers, idPrefix){
  if(!drivers || !drivers.length) return '';
  const id = nextId(idPrefix + '-i');
  const chips = drivers.map(function(d){
    let cls = 'drv';
    if(d === 'fundamental') cls += ' fund';
    else if(d === 'sentiment') cls += ' sent';
    // mechanical / optionality -> base .drv styling
    return '<span class="' + cls + '">' + d + '</span>';
  }).join('');
  const row = '<div class="drill-row"><b>Drivers' + infoBtnHtml(id) + '</b><div class="drivers">' + chips + '</div></div>';
  return row + infoPopHtml(id, INFO_TEXT.drivers);
}

// ============ PERFORMERS (ETF) ============

function buildPerformerDrill(fund, drillId){
  let html = '<div class="drill-panel" id="' + drillId + '">';
  html += fund.tier === 'researched'
    ? '<span class="tier-tag tier-researched">RESEARCHED</span>'
    : '<span class="tier-tag tier-screener">SCREENER DATA</span>';
  html += fieldRow('Holds', fund.holds, null, drillId);
  if(fund.tier === 'researched'){
    html += fieldRow('Why it moved', fund.whyItMoved, null, drillId);
  }
  html += fieldRow('vs category', fund.vsCategory, 'category', drillId);
  html += fieldRow('Return / Risk', fund.returnRisk, 'returnRisk', drillId);
  html += fieldRow('52w position', fund.week52, 'week52', drillId);
  html += fieldRow('AUM flow', fund.aumFlow, 'aumFlow', drillId);
  if(fund.tier === 'researched'){
    html += fieldRow('Top holdings', fund.topHoldings, 'topHoldings', drillId);
  }
  html += '</div>';
  return html;
}

function buildRankRow(fund, rank, drillId){
  let html = '<div class="rank-row" onclick="toggleDrill(\'' + drillId + '\')">';
  html += '<div class="rank-num">' + String(rank).padStart(2,'0') + '</div>';
  html += '<div><div class="rank-ticker">' + fund.ticker + '<span class="rank-name">' + fund.name + '</span></div>';
  html += '<div class="rank-tags"><span class="tag-cat">' + fund.category + '</span>' + badgesHtml(fund) + '</div></div>';
  html += '<div class="rank-pct ' + pctClass(fund.pct) + '">' + fmtPct(fund.pct) + '</div>';
  html += '</div>';
  html += buildPerformerDrill(fund, drillId);
  return html;
}

function buildSection(title, cssClass, funds, idPrefix){
  let html = '<div class="sec-label ' + cssClass + '"><h2>' + title + '</h2></div><div class="rank-list">';
  funds.forEach(function(fund, i){
    html += buildRankRow(fund, i + 1, idPrefix + '-' + i);
  });
  html += '</div>';
  return html;
}

function renderPerformersPeriod(periodKey, containerId){
  const data = LEDGER_DATA.performers[periodKey];
  let html = buildSection('Best Performers', 'best', data.best, 'd-' + periodKey + '-b');
  html += buildSection('Worst Performers', 'worst', data.worst, 'd-' + periodKey + '-w');
  document.getElementById(containerId).innerHTML = html;
}

// ============ STOCKS (S&P 500) ============
// Same row skeleton + CSS as Performers, but a different field set:
// does / whyItMoved / drivers / vsSector / week52 / volume. No AUM, no
// Return/Risk, no top-holdings (single-stock has none of those).

function buildStockDrill(fund, drillId){
  let html = '<div class="drill-panel" id="' + drillId + '">';
  html += fund.tier === 'researched'
    ? '<span class="tier-tag tier-researched">RESEARCHED</span>'
    : '<span class="tier-tag tier-screener">SCREENER DATA</span>';
  html += fieldRow('Does', fund.does, null, drillId);
  if(fund.tier === 'researched'){
    html += fieldRow('Why it moved', fund.whyItMoved, null, drillId);
    html += driversRow(fund.drivers, drillId);
  }
  html += fieldRow('vs sector', fund.vsSector, 'vsSector', drillId);
  html += fieldRow('52w position', fund.week52, 'week52', drillId);
  // volume present on 1M rows only; absent on 6M/YTD -> row silently omitted
  html += fieldRow('Volume', fund.volume, 'volume', drillId);
  html += '</div>';
  return html;
}

function buildStockRankRow(fund, rank, drillId){
  let html = '<div class="rank-row" onclick="toggleDrill(\'' + drillId + '\')">';
  html += '<div class="rank-num">' + String(rank).padStart(2,'0') + '</div>';
  html += '<div><div class="rank-ticker">' + fund.ticker + '<span class="rank-name">' + fund.name + '</span></div>';
  html += '<div class="rank-tags"><span class="tag-cat">' + fund.category + '</span><span class="tag-ccy">USD</span>' + badgesHtml(fund) + '</div></div>';
  html += '<div class="rank-pct ' + pctClass(fund.pct) + '">' + fmtPct(fund.pct) + '</div>';
  html += '</div>';
  html += buildStockDrill(fund, drillId);
  return html;
}

function buildStockSection(title, cssClass, funds, idPrefix){
  let html = '<div class="sec-label ' + cssClass + '"><h2>' + title + '</h2></div><div class="rank-list">';
  funds.forEach(function(fund, i){
    html += buildStockRankRow(fund, i + 1, idPrefix + '-' + i);
  });
  html += '</div>';
  return html;
}

function renderStocksPeriod(periodKey, containerId){
  const data = MOVERS.stocks[periodKey];
  let html = buildStockSection('Best Performers', 'best', data.best, 's-' + periodKey + '-b');
  html += buildStockSection('Worst Performers', 'worst', data.worst, 's-' + periodKey + '-w');
  document.getElementById(containerId).innerHTML = html;
}

function renderStocks(){
  const label = document.getElementById('stocks-universe');
  // Graceful degradation: movers.js absent/stale -> tab shows a wait note,
  // rest of the app is untouched.
  if(typeof MOVERS === 'undefined' || !MOVERS.stocks){
    label.innerHTML = 'Stock data not available yet';
    document.getElementById('spanel-1m').innerHTML =
      '<div class="empty-note">The weekly run will populate this.</div>';
    return;
  }
  const m = MOVERS.meta || {};
  let lbl = (m.universe || 'S&P 500') + ' &middot; <b>not all names buyable on Lightyear</b> &middot; returns in USD';
  if(m.sourceStatus){
    lbl += ' &middot; <span class="src-tag src-' + m.sourceStatus + '">' + m.sourceStatus + '</span>';
  }
  label.innerHTML = lbl;
  renderStocksPeriod('1m', 'spanel-1m');
  renderStocksPeriod('6m', 'spanel-6m');
  renderStocksPeriod('ytd', 'spanel-ytd');
}

// ============ PORTFOLIO ============

function buildHoldingsRow(fund, drillId){
  let html = '<div class="holdings-row" onclick="toggleDrill(\'' + drillId + '\')">';
  html += '<div><div class="holdings-ticker">' + fund.ticker + '<span class="holdings-name">' + fund.name + '</span></div></div>';
  html += '<div class="holdings-pct ' + pctClass(fund.pct1m) + '">' + fmtPct(fund.pct1m) + '</div>';
  html += '<div class="holdings-pct ' + pctClass(fund.pct6m) + '">' + fmtPct(fund.pct6m) + '</div>';
  html += '<div class="holdings-pct ' + pctClass(fund.pctYtd) + '">' + fmtPct(fund.pctYtd) + '</div>';
  html += '</div>';
  html += '<div class="drill-panel" id="' + drillId + '">';
  html += '<span class="tier-tag tier-portfolio">PORTFOLIO &middot; FULL COVERAGE</span>';
  html += fieldRow('Holds', fund.holds, null, drillId);
  html += fieldRow('Why it moved', fund.whyItMoved, null, drillId);
  html += fieldRow('vs category', fund.vsCategory, 'category', drillId);
  html += fieldRow('Return / Risk', fund.returnRisk, 'returnRisk', drillId);
  html += fieldRow('52w position', fund.week52, 'week52', drillId);
  html += fieldRow('AUM flow', fund.aumFlow, 'aumFlow', drillId);
  html += fieldRow('Top holdings', fund.topHoldings, 'topHoldings', drillId);
  html += '</div>';
  return html;
}

function renderPortfolio(){
  let html = '<div class="holdings-head"><span>Fund</span><span>1M</span><span>6M</span><span>YTD</span></div>';
  LEDGER_DATA.portfolio.forEach(function(fund, i){
    html += buildHoldingsRow(fund, 'd-pf-' + i);
  });
  document.getElementById('holdings-list').innerHTML = html;
}

// ============ MAG7 SCORECARD ============

function buildMag7Card(s){
  const vc = s.verdict.toLowerCase();
  let html = '<div class="mag7-card v-' + vc + '">';
  // Header: ticker + name | price + change
  html += '<div class="mag7-head">';
  html += '<div><span class="mag7-ticker">' + s.ticker + '</span><span class="mag7-name">' + s.name + '</span></div>';
  const chgNum = parseFloat(s.change);
  html += '<div class="mag7-price"><span class="mag7-price-val">' + s.price + '</span>';
  html += '<span class="mag7-change ' + pctClass(chgNum) + '">' + s.change + ' wk</span></div>';
  html += '</div>';
  // Theme
  html += '<div class="mag7-theme">' + s.theme + '</div>';
  // PE
  html += '<div class="mag7-pe">' + s.pe + ' <em>' + s.pe_plain + '</em></div>';
  // News
  html += '<div class="mag7-news">' + s.news + '</div>';
  // Earnings + proximity + target
  html += '<div class="mag7-meta-row">';
  html += '<span class="mag7-earnings">Earnings: ' + s.earnings + '</span>';
  html += '<span class="mag7-prox p-' + s.earnings_proximity + '">' + s.earnings_proximity.toUpperCase() + '</span>';
  html += '</div>';
  html += '<div class="mag7-meta-row"><span class="mag7-target">Target: ' + s.target + '</span></div>';
  // Verdict
  html += '<div class="mag7-verdict-row">';
  html += '<span class="mag7-verdict-badge vb-' + vc + '">' + s.verdict + '</span>';
  html += '<span class="mag7-reason">' + s.verdict_reason + '</span>';
  html += '</div>';
  html += '</div>';
  return html;
}

function renderMag7(){
  const container = document.getElementById('view-mag7');
  if(typeof MAG7 === 'undefined' || !MAG7.stocks){
    container.innerHTML = '<div class="empty-note">Mag7 data not available yet.</div>';
    return;
  }
  let html = '<div class="mag7-universe">' + (MAG7.meta.universe || 'Mag7') +
    ' &middot; <b>as of ' + MAG7.meta.asOf + '</b> &middot; ' +
    (MAG7.meta.fxRate || '') + '</div>';
  html += '<div class="mag7-cards">';
  MAG7.stocks.forEach(function(s){ html += buildMag7Card(s); });
  html += '</div>';
  container.innerHTML = html;
}

function renderMeta(){
  const m = LEDGER_DATA.meta;
  let html = '<span>' + m.fundsTracked + ' funds tracked</span><span class="dot">&middot;</span><span>Data as of ' + m.asOf + '</span>';
  // FX chip: ambient EUR/USD reference from movers.js. Hides if absent.
  if(typeof MOVERS !== 'undefined' && MOVERS.meta && MOVERS.meta.fxRate){
    html += '<span class="dot">&middot;</span><span class="fx-chip">' + MOVERS.meta.fxRate + '</span>';
  }
  document.getElementById('meta-bar').innerHTML = html;
}

function renderClose(){
  document.getElementById('ledger-close').innerHTML =
    '<div class="close-note">ETF NEWS &middot; BUSINESS LITERACY TOOL, NOT INVESTMENT ADVICE</div>';
}

function showMain(id, btn){
  document.querySelectorAll('.mtab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.main-view').forEach(function(v){v.classList.remove('on');});
  document.getElementById('view-' + id).classList.add('on');
}
// Scoped to #view-performers so the Stocks period tabs don't cross-talk.
function showTab(id, btn){
  const view = document.getElementById('view-performers');
  view.querySelectorAll('.ptab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  view.querySelectorAll('.period-panel').forEach(function(p){p.classList.remove('on');});
  document.getElementById('panel-' + id).classList.add('on');
}
// Independent period switching for the Stocks view.
function showStockTab(id, btn){
  const view = document.getElementById('view-stocks');
  view.querySelectorAll('.ptab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  view.querySelectorAll('.period-panel').forEach(function(p){p.classList.remove('on');});
  document.getElementById('spanel-' + id).classList.add('on');
}
function toggleDrill(id){
  document.getElementById(id).classList.toggle('open');
}
function toggleInfo(id){
  document.getElementById(id).classList.toggle('open');
}

renderMeta();
renderPerformersPeriod('1m', 'panel-1m');
renderPerformersPeriod('6m', 'panel-6m');
renderPerformersPeriod('ytd', 'panel-ytd');
renderPortfolio();
renderStocks();
renderMag7();
renderClose();
</script>
</body>
